[FilterPlugin]
; Estuary plugin packaging filter.
; Controls which files are included when the plugin is packaged for distribution.
; Phase 10 (QA/Fab) will harden this list if Fab submission becomes a goal.

; Include compiled binaries
+Include=Binaries/...

; Include all source files
+Include=Source/...

; Include config files
+Include=Config/...

; Include plugin manifest
+Include=Estuary.uplugin

; Include documentation
; (CLAUDE.md is internal AI-agent guidance — intentionally NOT packaged.)
+Include=README.md
+Include=THIRD_PARTY_NOTICES.md
+Include=LICENSE
